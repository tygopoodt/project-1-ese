<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760">
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#111}
  .ttl{font-size:18px;font-weight:bold}
  .sub{font-size:12.5px;fill:#555}
  .sec{font-size:14px;font-weight:bold}
  .cap{font-size:12px}
  .capn{font-size:12px;font-weight:bold}
  .note{font-size:11.5px;fill:#555;font-style:italic}
  .cb{fill:#f0f0f0;stroke:#111;stroke-width:1.6}
  .wh{fill:#bbb;stroke:#111;stroke-width:1.1}
  .sn{fill:#d8d8d8;stroke:#111;stroke-width:1.1}
  .rf{fill:url(#hatch);stroke:#111;stroke-width:1.1}
  .wall{fill:url(#hatch);stroke:#111;stroke-width:1.6}
  .dim{stroke:#1F6F8B;stroke-width:1.2;fill:none}
  .dimt{font-size:11.5px;fill:#1F6F8B}
  .dimc{font-size:11.5px;fill:#1F6F8B;text-anchor:middle}
  .band{stroke:#1F6F8B;stroke-width:1.1;stroke-dasharray:6 4;fill:none}
  .mv{stroke:#111;stroke-width:1.8;fill:none}
</style>
<defs>
  <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#111" stroke-width="1.4"/>
  </pattern>
  <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto">
    <path d="M0,0 L7,2.6 L0,5.2 z" fill="#1F6F8B"/>
  </marker>
  <marker id="a2" markerWidth="8" markerHeight="8" refX="1" refY="2.6" orient="auto">
    <path d="M7,0 L0,2.6 L7,5.2 z" fill="#1F6F8B"/>
  </marker>
  <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 z" fill="#111"/>
  </marker>
</defs>
<rect width="900" height="760" fill="#fff"/>

<text class="ttl" x="40" y="34">Figuur 4 — Gedrag op het parcours bij F2 (autonoom) en F3 (slave mode)</text>
<text class="sub" x="40" y="54">Bovenaanzicht. Schetsen zijn niet op schaal; de genoemde maten komen uit de functionele eisen F2 en F3.</text>

<!-- ================= A. F2 ================= -->
<text class="sec" x="40" y="90">A. Autonoom rijden — obstakel naderen, stoppen en uitwijken</text>

<!-- ---- scene 1 ---- -->
<g transform="translate(110,118)">
  <rect class="wh" x="12" y="0" width="11" height="6"/><rect class="wh" x="38" y="0" width="11" height="6"/>
  <rect class="wh" x="12" y="34" width="11" height="6"/><rect class="wh" x="38" y="34" width="11" height="6"/>
  <rect class="cb" x="6" y="5" width="48" height="30" rx="3"/>
  <rect class="sn" x="52" y="14" width="7" height="12" rx="1"/>
</g>
<rect class="wall" x="640" y="108" width="18" height="72"/>
<path class="dim" d="M173,138 L637,138" marker-start="url(#a2)" marker-end="url(#a1)"/>
<text class="dimc" x="405" y="132">geen obstakel binnen 30 cm</text>
<path class="mv" d="M178,168 L242,168" marker-end="url(#ab)"/>
<text class="capn" x="40" y="204">1</text>
<text class="cap" x="58" y="204">Vrije ruimte recht vooruit &#8805; 30 cm: de robot-car rijdt vooruit (F2.1). Display regel 2: VOORUIT STAND 2. Richting-LED's uit.</text>

<!-- ---- scene 2 ---- -->
<g transform="translate(500,232)">
  <rect class="wh" x="12" y="0" width="11" height="6"/><rect class="wh" x="38" y="0" width="11" height="6"/>
  <rect class="wh" x="12" y="34" width="11" height="6"/><rect class="wh" x="38" y="34" width="11" height="6"/>
  <rect class="cb" x="6" y="5" width="48" height="30" rx="3"/>
  <rect class="sn" x="52" y="14" width="7" height="12" rx="1"/>
</g>
<rect class="wall" x="640" y="222" width="18" height="72"/>
<path class="dim" d="M561,252 L637,252" marker-start="url(#a2)" marker-end="url(#a1)"/>
<text class="dimc" x="599" y="246">&lt; 20 cm</text>
<path class="dim" d="M614,280 L637,280" marker-start="url(#a2)" marker-end="url(#a1)"/>
<text class="dimt" x="470" y="302">na stilstand blijft minimaal 2 cm ruimte over</text>
<path class="dim" d="M625,284 L625,296 L618,296"/>
<text class="capn" x="40" y="330">2</text>
<text class="cap" x="58" y="330">Obstakel dichterbij dan 20 cm: binnen 500 ms remmen, binnen 1,5 s stil (F2.3). Display: STATUS: OBSTAKEL.</text>

<!-- ---- scene 3 ---- -->
<g transform="translate(500,356)">
  <rect class="wh" x="12" y="0" width="11" height="6"/><rect class="wh" x="38" y="0" width="11" height="6"/>
  <rect class="wh" x="12" y="34" width="11" height="6"/><rect class="wh" x="38" y="34" width="11" height="6"/>
  <rect class="cb" x="6" y="5" width="48" height="30" rx="3"/>
  <rect class="sn" x="52" y="14" width="7" height="12" rx="1"/>
</g>
<rect class="wall" x="640" y="346" width="18" height="72"/>
<path class="mv" d="M534,350 C504,320 444,322 424,350" marker-end="url(#ab)"/>
<text class="cap" x="404" y="336" font-size="11" text-anchor="middle">draaien</text>
<path class="mv" d="M498,404 L414,404" stroke-dasharray="5 4" marker-end="url(#ab)"/>
<path class="dim" d="M410,420 L498,420" marker-start="url(#a2)" marker-end="url(#a1)"/>
<text class="dimc" x="454" y="436">of maximaal 30 cm achteruit</text>
<text class="capn" x="40" y="464">3</text>
<text class="cap" x="58" y="464">Binnen 4 s zelfstandig een nieuwe richting kiezen (F2.4); verder rijden zodra er recht vooruit &#8805; 60 cm vrij is. Richting-LED knippert (F1.4).</text>

<line x1="40" y1="492" x2="860" y2="492" stroke="#111" stroke-width="1"/>

<!-- ================= B. F3 ================= -->
<text class="sec" x="40" y="520">B. Slave mode — lijn volgen en afstand houden tot de voorganger</text>

<!-- band en lijn -->
<line class="band" x1="90" y1="596" x2="820" y2="596"/>
<line class="band" x1="90" y1="646" x2="820" y2="646"/>
<rect x="90" y="617" width="730" height="9" fill="#111"/>

<!-- volger -->
<g transform="translate(250,601)">
  <rect class="wh" x="12" y="0" width="11" height="6"/><rect class="wh" x="38" y="0" width="11" height="6"/>
  <rect class="wh" x="12" y="34" width="11" height="6"/><rect class="wh" x="38" y="34" width="11" height="6"/>
  <rect class="cb" x="6" y="5" width="48" height="30" rx="3"/>
  <rect class="sn" x="52" y="14" width="7" height="12" rx="1"/>
</g>
<text class="cap" x="280" y="588" font-size="11" text-anchor="middle">Robot-car in slave mode</text>

<!-- voorganger -->
<g transform="translate(600,601)">
  <rect class="wh" x="12" y="0" width="11" height="6"/><rect class="wh" x="38" y="0" width="11" height="6"/>
  <rect class="wh" x="12" y="34" width="11" height="6"/><rect class="wh" x="38" y="34" width="11" height="6"/>
  <rect class="cb" x="6" y="5" width="48" height="30" rx="3"/>
  <rect class="rf" x="1" y="11" width="6" height="18"/>
</g>
<text class="cap" x="700" y="588" font-size="11" text-anchor="middle">voorganger, met reflector (T7)</text>

<!-- afstand tot voorganger -->
<path class="dim" d="M312,564 L599,564" marker-start="url(#a2)" marker-end="url(#a1)"/>
<text class="dimc" x="455" y="558">afstand 10 &#8211; 50 cm (F3.2)</text>

<!-- afwijking t.o.v. de lijn -->
<path class="dim" d="M150,597 L150,645" marker-start="url(#a2)" marker-end="url(#a1)"/>
<text class="dimt" x="96" y="668">maximaal 5 cm afwijking t.o.v. de lijn (F3.1)</text>

<!-- tape -->
<path class="dim" d="M700,664 L700,628"/>
<text class="dimt" x="712" y="668">zwart tape, 1 &#8211; 2 cm breed (T9.1)</text>

<text class="capn" x="40" y="700">4</text>
<text class="cap" x="58" y="700">De robot-car blijft binnen 5 cm van de lijn en houdt 10 tot 50 cm afstand tot de voorganger. Display regel 2: VOORUIT.</text>
<text class="capn" x="40" y="720">5</text>
<text class="cap" x="58" y="720">Stopt de voorganger, dan staat de Robot-car binnen 2 s stil en vertrekt pas als de voorganger vertrekt (F3.3). Display: STATUS: WACHT.</text>

<text class="note" x="40" y="748">Het lijnparcours is een gesloten lus zonder kruisingen of splitsingen, met bochten van minimaal 25 cm straal (zie de afspraken bij F3).</text>
</svg>
